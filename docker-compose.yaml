name: gitlab
services:
  gitlab:
    container_name: gitlab
    image: gitlab/gitlab-ce:18.10.1-ce.0
    restart: always
    env_file: .env
    hostname: ${HOSTNAME}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Add any other gitlab.rb configuration here, each on its own line
        # External url. HTTP -> 80. HTTPS -> 433
        external_url 'https://${HOSTNAME}'
        # Container registry
        gitlab_rails['registry_enabled'] = true
        # External url. HTTP -> 80. HTTPS -> 433
        registry_external_url 'https://${REGISTRY_HOSTNAME}'
        # SMTP
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "${SMTP_SERVER}"
        gitlab_rails['smtp_port'] = ${SMTP_PORT}
        gitlab_rails['smtp_user_name'] = "${SMTP_USER}"
        gitlab_rails['smtp_password'] = "${SMTP_PASSWORD}"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_tls'] = true
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = "none"
        gitlab_rails['gitlab_email_from'] = '${SMTP_DEFAULT_FROM_EMAIL}'
        gitlab_rails['gitlab_email_reply_to'] = '${SMTP_DEFAULT_FROM_EMAIL}'
        # Puma workers (reemplaza Unicorn desde GitLab 13+)
        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        # Sidekiq
        sidekiq['concurrency'] = 5
        # PostgreSQL
        postgresql['shared_buffers'] = "256MB"
        postgresql['max_connections'] = 100
        postgresql['work_mem'] = "8MB"
        # Redis 
        redis['maxmemory'] = "200mb"
        redis['maxmemory_policy'] = "allkeys-lru"
        # Prometheus y monitoreo interno 
        # Deshabilitalo si no usás el monitoreo interno de GitLab
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        # Servicios opcionales 
        # Deshabilitá lo que no uses
        mattermost['enable'] = false

        # Gitaly (ajuste de workers) 
        gitaly['configuration'] = {
          concurrency: [
            { 'rpc' => "/gitaly.SmartHTTPService/PostReceivePack", 'max_per_repo' => 3 },
            { 'rpc' => "/gitaly.SSHService/SSHUploadPack", 'max_per_repo' => 3 },
          ]
        }
        # --- OmniAuth & SSO Settings ---
        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        # Automatically link Microsoft accounts to existing GitLab accounts with the same email
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        # Sync profile details from Microsoft
        gitlab_rails['omniauth_sync_profile_from_provider'] = ['openid_connect']
        gitlab_rails['omniauth_sync_profile_attributes'] = ['name', 'email']
        # Block automatic account creation if you only want existing users to log in
        # Change to false if you want Microsoft to automatically provision brand new GitLab accounts
        gitlab_rails['omniauth_block_auto_created_users'] = true 

        # --- OIDC Provider Configuration ---
        gitlab_rails['omniauth_providers'] = [
          {
            name: "openid_connect",
            label: "Entra ID (Microsoft 365)", # This is the text on the login button
            args: {
              name: "openid_connect",
              scope: ["openid", "profile", "email"],
              response_type: "code",
              issuer: "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0",
              discovery: true,
              client_auth_method: "query",
              uid_field: "preferred_username",
              send_scope_to_token_endpoint: "false",
              client_options: {
                identifier: "${ENTRA_CLIENT_ID}",
                secret: "${ENTRA_CLIENT_SECRET}",
                redirect_uri: "https://${HOSTNAME}/users/auth/openid_connect/callback"
              }
            }
          }
        ]
    ports:
      - ${APP_PORT}:443
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab
      - ./certs/registry.justierradelfuego.gov.ar.crt:/etc/gitlab/ssl/registry.justierradelfuego.gov.ar.crt
      - ./certs/registry.justierradelfuego.gov.ar.key:/etc/gitlab/ssl/registry.justierradelfuego.gov.ar.key
    networks:
      - nginx-proxy
    # disable saving logs
    logging:
      driver: none

networks:
  nginx-proxy:
    external: true

